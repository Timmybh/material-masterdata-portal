services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-masterdata}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-masterdata}"]
      interval: 5s
      timeout: 5s
      retries: 10

  seed:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./database/seed:/seed:ro
    command: >
      sh -c "psql -h db -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-masterdata} -v ON_ERROR_STOP=1 -f /seed/seed_v1_4_2.sql && psql -h db -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-masterdata} -v ON_ERROR_STOP=1 -f /seed/v1_5_auth.sql && psql -h db -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-masterdata} -v ON_ERROR_STOP=1 -f /seed/v1_5_1_workflow_email.sql && psql -h db -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-masterdata} -v ON_ERROR_STOP=1 -f /seed/v1_5_2_category_brand_ai.sql"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
      AI_NAMING_ENABLED: ${AI_NAMING_ENABLED:-true}
      COMPANY_NAMING_RULES: ${COMPANY_NAMING_RULES:-Tên tiếng Việt rõ nghĩa; thứ tự chủng loại - công dụng/đặc tính - nhãn hiệu - model/thông số; không thêm thông tin chưa được cung cấp.}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres-data:
