server { listen 80; server_name _; root /usr/share/nginx/html; index index.html;
  location /api/ { proxy_pass http://backend:8000/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /health { proxy_pass http://backend:8000/health; }
  location ~* \.(html|js|css)$ { add_header Cache-Control "no-cache, no-store, must-revalidate" always; try_files $uri /index.html; }
  location / { try_files $uri /index.html; }
}
